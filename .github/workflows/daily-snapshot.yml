# 매일 총자산 스냅샷을 기록한다.
# Fly 서버는 평소 꺼져 있다가(min_machines_running = 0) 이 요청으로 깨어난다.
# 필요한 저장소 설정:
#   Secrets  SNAPSHOT_API_KEY  — Fly 서버의 API_KEY 와 같은 값
#   (선택) Variables  SNAPSHOT_API_URL — 기본값은 아래 Fly 주소
# GitHub 는 저장소에 60일간 활동이 없으면 예약 실행을 멈추므로, 그때는 Actions 탭에서 다시 켜야 한다.

name: Daily Asset Snapshot
on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST (미국장 마감 후)
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture today's snapshot
        env:
          API_URL: ${{ vars.SNAPSHOT_API_URL || 'https://stock-manager-api-patient-cloud-8941.fly.dev' }}
          API_KEY: ${{ secrets.SNAPSHOT_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::SNAPSHOT_API_KEY secret is not set"
            exit 1
          fi
          # 서버가 깨어나는 동안 실패할 수 있어 몇 번 재시도한다.
          # 응답에는 자산 금액이 들어 있으므로 로그에 남기지 않고 상태 코드만 확인한다.
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-API-Key: $API_KEY" \
            "$API_URL/api/snapshots/daily/capture?source=cron")
          echo "HTTP $code"
          [ "$code" = "200" ]
