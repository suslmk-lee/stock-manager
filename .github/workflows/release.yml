# 버전 태그(v1.2.3)를 올리면 macOS 설치 파일(DMG)을 만들어 GitHub Release 에 올린다.
# 설치된 앱은 켤 때와 3시간마다 이 Release 를 확인해 '업데이트' 버튼을 띄운다.
#   git tag v1.2.3 && git push origin v1.2.3
# Release 본문(바뀐 점)은 이전 태그 이후 커밋 메시지로 자동 생성된다.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 빌드할 태그 (예: v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    # 특정 버전(macos-14 등)은 GitHub 가 지원을 끝내면 작업이 바로 취소되므로 최신 이미지를 쓴다
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Set app version in wails.json (Info.plist 버전 표시용)
        run: |
          VER="${TAG#v}"
          sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${VER}\"/" wails.json
          grep productVersion wails.json

      - name: Build DMG (Apple Silicon + Intel)
        run: APP_VERSION="$TAG" scripts/build-dmg.sh --universal

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Stock Manager ${{ env.TAG }}
          generate_release_notes: true
          files: build/bin/*.dmg
